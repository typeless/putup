name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  format-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check formatting
        run: make format-check

  build-linux:
    needs: format-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Bootstrap build
        run: ./bootstrap-linux.sh
      # Bootstrap replays a flat command list and writes no .pup index. Re-run
      # the same build through putup itself so the artifact ships a truthful
      # index; the test job then null-builds and runs only the test rules.
      # -D LTO must match the bootstrap flags or every command identity differs.
      - name: Index build
        run: ./build/putup -B build -D LTO
      - name: Binary size stats
        run: |
          .github/scripts/metrics size build/putup > size-metrics.tsv
          .github/scripts/metrics render --size size-metrics.tsv >> "$GITHUB_STEP_SUMMARY"
      - name: Upload size metrics
        uses: actions/upload-artifact@v4
        with:
          name: pr-size-metrics
          path: size-metrics.tsv
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-linux
          path: build/
          include-hidden-files: true  # ship .pup so the test job has an index

  build-macos:
    needs: format-check
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Bootstrap build
        run: ./bootstrap-macos.sh
      - name: Index build  # see build-linux: gives the artifact a .pup index
        run: ./build/putup -B build -D LTO
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-macos
          path: build/
          include-hidden-files: true

  # Windows x86_64: cross-compile from Linux (clang-cl + xwin, MSVC ABI) using the
  # Linux putup as the build driver; the tests run natively in the test-windows job.
  build-windows:
    needs: build-linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-linux
          path: build/
      - name: Fix permissions
        run: chmod +x build/putup
      - name: Install clang-cl toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld llvm
          for t in clang-cl lld-link llvm-lib; do
            sudo ln -sf "$(ls /usr/bin/$t-* | sort -V | tail -1)" /usr/local/bin/$t
          done
      - name: Fetch MSVC CRT + Windows SDK (xwin)
        run: |
          curl -fsSL https://github.com/Jake-Shadle/xwin/releases/download/0.9.0/xwin-0.9.0-x86_64-unknown-linux-musl.tar.gz | tar -xz
          ./xwin-*/xwin --accept-license --arch x86_64 splat --output "$HOME/.xwin/splat"
      - name: Cross-build putup.exe (clang-cl + xwin)
        run: |
          export XWIN_SPLAT="$HOME/.xwin/splat"
          CONFIG=xwin ./build/putup configure -B build-win
          CONFIG=xwin ./build/putup -B build-win
      - name: Upload Windows test binary
        uses: actions/upload-artifact@v4
        with:
          name: putup-test-windows
          path: build-win/test/unit/putup_test.exe

  # Run the cross-built Windows test binary natively on a Windows runner.
  test-windows:
    needs: build-windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Download Windows test binary
        uses: actions/download-artifact@v4
        with:
          name: putup-test-windows
      - name: Run tests
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Recurse -Filter putup_test.exe | Select-Object -First 1
          if (-not $exe) { throw "putup_test.exe not found in artifact" }
          Write-Host "Running $($exe.FullName)"
          & $exe.FullName "~[e2e]~[shell]"
          exit $LASTEXITCODE

  test-linux:
    needs: build-linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-linux
          path: build/
      - name: Fix permissions
        run: chmod +x build/putup build/test/unit/putup_test
      # Run tests as graph rules driven by the artifact's own putup (driver =
      # subject). -D LTO matches the index the build job wrote; the shipped
      # index means only the test rules run, not a rebuild. The summary file
      # can only exist if the runner actually executed — a driver that skipped
      # the test rules leaves it absent and the cat fails the job.
      - name: Run tests
        run: |
          ./build/putup -B build -D LTO -j16 test/runner/
          cat build/test/runner/summary.txt

  test-macos:
    needs: build-macos
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-macos
          path: build/
      - name: Fix permissions
        run: chmod +x build/putup build/test/unit/putup_test
      - name: Run tests  # see test-linux
        run: |
          ./build/putup -B build -D LTO -j16 test/runner/
          cat build/test/runner/summary.txt

  tidy:
    needs: build-linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-linux
          path: build/
      - name: Fix permissions
        run: chmod +x build/putup
      - name: Run clang-tidy
        run: make tidy PUTUP=./build/putup RUN_CLANG_TIDY=run-clang-tidy-18

  # CI bootstraps itself from the committed bootstrap-*.sh, so their drift is invisible until someone regenerates.
  bootstrap-drift:
    needs: build-linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-linux
          path: build/
      - name: Fix permissions
        run: chmod +x build/putup
      - name: Regenerate bootstrap scripts
        run: make bootstrap-scripts PUTUP=./build/putup
      - name: Check for drift
        run: |
          git diff --exit-code -- bootstrap-linux.sh bootstrap-macos.sh && exit 0
          echo "::error title=Stale bootstrap scripts::bootstrap-linux.sh / bootstrap-macos.sh do not match the current Tupfile and configs. Run 'make bootstrap' on Linux and commit the regenerated scripts."
          exit 1

  coverage:
    needs: build-linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-linux
          path: build/
      - name: Fix permissions
        run: chmod +x build/putup
      - name: Install gcovr
        run: pipx install gcovr
      - name: Build instrumented variant and generate report
        run: make coverage PUTUP=./build/putup
      - name: Coverage stats
        run: |
          .github/scripts/metrics coverage build-coverage/report/summary.json > coverage-metrics.tsv
          .github/scripts/metrics render --coverage coverage-metrics.tsv >> "$GITHUB_STEP_SUMMARY"
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: build-coverage/report/
      - name: Upload coverage metrics
        uses: actions/upload-artifact@v4
        with:
          name: pr-coverage-metrics
          path: coverage-metrics.tsv

  build-gcc-bsp:
    needs: build-linux
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-linux
          path: build/
      - name: Fix permissions
        run: chmod +x build/putup
      - name: Cache source tarballs
        uses: actions/cache@v4
        with:
          path: source-root
          key: gcc-bsp-src-gcc15.2.0-binutils2.44
      - name: Download source
        working-directory: examples/bsp
        run: scripts/download-source.sh ../../source-root
      - name: Configure
        working-directory: examples/bsp
        run: ../../build/putup configure --config configs/x86_64-linux.config -C . -S ../../source-root -B ../../build-gcc
      - name: Build
        working-directory: examples/bsp
        run: ../../build/putup -C . -S ../../source-root -B ../../build-gcc -j$(nproc)
      - name: Smoke test cc1
        run: |
          echo 'int main() { return 0; }' > /tmp/test.c
          build-gcc/gcc/gcc/cc1 /tmp/test.c -quiet -o /tmp/test.s
          grep 'GCC.*15.2.0' /tmp/test.s
      - name: Benchmark (perf)
        run: |
          sudo sysctl -w kernel.perf_event_paranoid=1
          sudo apt-get install -y valgrind
          sudo apt-get install -y linux-tools-$(uname -r) || sudo apt-get install -y linux-tools-generic
          command -v perf >/dev/null || export PERF="$(ls /usr/lib/linux-tools/*/perf | sort -V | tail -1)"
          .github/scripts/metrics bench build/putup examples/bsp source-root build-gcc > perf-metrics.tsv
          .github/scripts/metrics render --perf perf-metrics.tsv >> "$GITHUB_STEP_SUMMARY"
      - name: Internal stats (--stat)
        run: |
          .github/scripts/metrics stat build/putup examples/bsp source-root build-gcc > stat-metrics.tsv
          .github/scripts/metrics render --stat stat-metrics.tsv >> "$GITHUB_STEP_SUMMARY"
      - name: Upload perf metrics
        uses: actions/upload-artifact@v4
        with:
          name: pr-perf-metrics
          path: perf-metrics.tsv
      - name: Upload stat metrics
        uses: actions/upload-artifact@v4
        with:
          name: pr-stat-metrics
          path: stat-metrics.tsv

  pr-metrics-comment:
    if: github.event_name == 'pull_request'
    needs: [coverage, build-gcc-bsp]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      actions: read
    steps:
      - uses: actions/checkout@v7
      - name: Download perf metrics
        uses: actions/download-artifact@v4
        with:
          name: pr-perf-metrics
      - name: Download stat metrics
        uses: actions/download-artifact@v4
        with:
          name: pr-stat-metrics
      - name: Download size metrics
        uses: actions/download-artifact@v4
        with:
          name: pr-size-metrics
      - name: Download coverage metrics
        uses: actions/download-artifact@v4
        with:
          name: pr-coverage-metrics
      - name: Fetch baseline metrics from the last main run
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          run=$(gh run list -R "$REPO" --workflow ci.yml --branch main --event push \
            --status success --json databaseId,headSha --jq '.[0] // empty' -L 1)
          if [ -n "$run" ]; then
            gh run download "$(echo "$run" | jq -r .databaseId)" -R "$REPO" \
              -n pr-perf-metrics -D baseline/perf || true
            gh run download "$(echo "$run" | jq -r .databaseId)" -R "$REPO" \
              -n pr-stat-metrics -D baseline/stat || true
            gh run download "$(echo "$run" | jq -r .databaseId)" -R "$REPO" \
              -n pr-size-metrics -D baseline/size || true
            gh run download "$(echo "$run" | jq -r .databaseId)" -R "$REPO" \
              -n pr-coverage-metrics -D baseline/cov || true
            echo "BASE_SHA=$(echo "$run" | jq -r .headSha)" >> "$GITHUB_ENV"
          fi
      - name: Upsert sticky comment
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          .github/scripts/metrics render \
            --perf perf-metrics.tsv --stat stat-metrics.tsv \
            --size size-metrics.tsv \
            --coverage coverage-metrics.tsv \
            --baseline-perf baseline/perf/perf-metrics.tsv \
            --baseline-stat baseline/stat/stat-metrics.tsv \
            --baseline-size baseline/size/size-metrics.tsv \
            --baseline-coverage baseline/cov/coverage-metrics.tsv \
            --baseline-label "main@${BASE_SHA:0:9}" > metrics.md
          marker='<!-- pr-metrics -->'
          {
            echo "$marker"
            echo "## PR metrics"
            echo
            cat metrics.md
            echo
            echo "_Updated for ${SHA}_"
          } > body.md
          cid=$(gh api "repos/$REPO/issues/$PR/comments" --paginate \
            --jq "map(select(.body | startswith(\"$marker\"))) | .[0].id // empty")
          if [ -n "$cid" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$cid" -F body=@body.md
          else
            gh api -X POST "repos/$REPO/issues/$PR/comments" -F body=@body.md
          fi
