name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  format-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install clang-format
        run: sudo apt-get install -y clang-format-17
      - name: Check formatting
        run: |
          find src include -name '*.cpp' -o -name '*.hpp' | \
            xargs clang-format-17 --dry-run --Werror

  build-linux:
    needs: format-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bootstrap build
        run: ./bootstrap-linux.sh
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-linux
          path: build/

  build-macos:
    needs: format-check
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bootstrap build
        run: ./bootstrap-macos.sh
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-macos
          path: build/

  build-windows:
    needs: format-check
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          install: mingw-w64-ucrt-x86_64-gcc make
      - name: Bootstrap build
        run: ./bootstrap-win32.sh
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-windows
          path: build/

  test-linux:
    needs: build-linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-linux
          path: build/
      - name: Fix permissions
        run: chmod +x build/putup build/test/unit/putup_test
      - name: Run tests
        run: ./build/test/unit/putup_test

  test-macos:
    needs: build-macos
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-macos
          path: build/
      - name: Fix permissions
        run: chmod +x build/putup build/test/unit/putup_test
      - name: Run tests
        run: ./build/test/unit/putup_test

  test-windows:
    needs: build-windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-windows
          path: build/
      - name: Run tests
        run: ./build/test/unit/putup_test.exe

  tidy:
    needs: build-linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install clang-tidy
        run: sudo apt-get install -y clang-tidy-17
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-linux
          path: build/
      - name: Fix permissions
        run: chmod +x build/putup
      - name: Generate compile_commands.json
        run: ./build/putup show compdb -B build > compile_commands.json
      - name: Run clang-tidy
        run: run-clang-tidy-17 -p .
