name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  format-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check formatting
        run: make format-check

  build-linux:
    needs: format-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bootstrap build
        run: ./bootstrap-linux.sh
      # MSVC bootstrap disabled — see COMPATIBILITY.md (NRVO limitation)
      # - name: Generate MSVC bootstrap script
      #   run: |
      #     cp configs/msvc.config build/tup.config
      #     CONFIG=msvc ./build/putup show script -B build > build/bootstrap-msvc.bat
      #     cp configs/linux.config build/tup.config
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-linux
          path: build/

  build-macos:
    needs: format-check
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bootstrap build
        run: ./bootstrap-macos.sh
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-macos
          path: build/

  # MSVC build disabled — NRVO limitation causes stale StringPool pointers.
  # See COMPATIBILITY.md for details.
  # build-windows-msvc:
  #   needs: build-linux
  #   runs-on: windows-latest
  #   steps:
  #     - uses: actions/checkout@v4
  #     - name: Download pre-generated bootstrap script
  #       uses: actions/download-artifact@v4
  #       with:
  #         name: build-linux
  #         path: artifacts/
  #     - name: Setup MSVC build
  #       run: |
  #         mkdir -p build
  #         cp configs/msvc.config build/tup.config
  #         cp artifacts/bootstrap-msvc.bat .
  #       shell: bash
  #     - uses: ilammy/msvc-dev-cmd@v1
  #     - name: Bootstrap build
  #       shell: cmd
  #       run: bootstrap-msvc.bat
  #     - name: Upload build artifacts
  #       uses: actions/upload-artifact@v4
  #       with:
  #         name: build-windows-msvc
  #         path: build/

  build-windows-mingw:
    needs: format-check
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          install: mingw-w64-ucrt-x86_64-gcc make
      - name: Bootstrap build
        run: ./bootstrap-mingw.sh
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-windows-mingw
          path: build/

  test-linux:
    needs: build-linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-linux
          path: build/
      - name: Fix permissions
        run: chmod +x build/putup build/test/unit/putup_test
      - name: Run tests
        run: ./build/test/unit/putup_test

  test-macos:
    needs: build-macos
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-macos
          path: build/
      - name: Fix permissions
        run: chmod +x build/putup build/test/unit/putup_test
      - name: Run tests
        run: ./build/test/unit/putup_test

  # MSVC tests disabled — see build-windows-msvc comment above.
  # test-windows-msvc:
  #   needs: build-windows-msvc
  #   runs-on: windows-latest
  #   steps:
  #     - uses: actions/checkout@v4
  #     - name: Download build artifacts
  #       uses: actions/download-artifact@v4
  #       with:
  #         name: build-windows-msvc
  #         path: build/
  #     - name: Run tests
  #       run: .\build\test\unit\putup_test.exe
  #       env:
  #         PUP: .\build\putup.exe

  test-windows-mingw:
    needs: build-windows-mingw
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-windows-mingw
          path: build/
      - name: Run tests
        run: ./build/test/unit/putup_test.exe "~[e2e]~[shell]"
        env:
          PUP: ./build/putup.exe

  tidy:
    needs: build-linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-linux
          path: build/
      - name: Fix permissions
        run: chmod +x build/putup
      # clang-tidy 18 (ubuntu default) errors on Checks: '-*' in
      # third_party/.clang-tidy ("no checks enabled", exit 1).
      # --allow-no-checks was added in 19. See llvm/llvm-project#86355
      - name: Install LLVM 21
        run: |
          wget -qO- https://apt.llvm.org/llvm.sh | sudo bash -s -- 21
          sudo apt-get install -y clang-tidy-21
      - name: Run clang-tidy
        run: make tidy PUTUP=./build/putup RUN_CLANG_TIDY=run-clang-tidy-21 TIDY_FLAGS=-allow-no-checks
