name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  format-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check formatting
        run: make format-check

  build-linux:
    needs: format-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Bootstrap build
        run: ./bootstrap-linux.sh
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-linux
          path: build/

  build-macos:
    needs: format-check
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Bootstrap build
        run: ./bootstrap-macos.sh
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-macos
          path: build/

  # Windows x86_64: cross-compile from Linux (clang-cl + xwin, MSVC ABI) using the
  # Linux putup as the build driver, then run the unit tests under Wine.
  build-windows:
    needs: build-linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-linux
          path: build/
      - name: Fix permissions
        run: chmod +x build/putup
      - name: Install clang-cl toolchain + Wine
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld llvm
          sudo apt-get install -y wine64 || sudo apt-get install -y wine
          for t in clang-cl lld-link llvm-lib; do
            sudo ln -sf "$(ls /usr/bin/$t-* | sort -V | tail -1)" /usr/local/bin/$t
          done
      - name: Fetch MSVC CRT + Windows SDK (xwin)
        run: |
          curl -fsSL https://github.com/Jake-Shadle/xwin/releases/download/0.9.0/xwin-0.9.0-x86_64-unknown-linux-musl.tar.gz | tar -xz
          ./xwin-*/xwin --accept-license --arch x86_64 splat --output "$HOME/.xwin/splat"
      - name: Cross-build putup.exe (clang-cl + xwin)
        run: |
          export XWIN_SPLAT="$HOME/.xwin/splat"
          CONFIG=xwin ./build/putup configure -B build-win
          CONFIG=xwin ./build/putup -B build-win
      - name: Run tests under Wine
        run: |
          export WINEPREFIX="$HOME/.wine-putup" WINEDEBUG=-all
          wineboot --init && sleep 2
          WINE=$(command -v wine64 || command -v wine)
          "$WINE" build-win/test/unit/putup_test.exe '~[e2e]~[shell]'
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-windows
          path: build-win/

  test-linux:
    needs: build-linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-linux
          path: build/
      - name: Fix permissions
        run: chmod +x build/putup build/test/unit/putup_test
      - name: Run tests
        run: ./build/test/unit/putup_test

  test-macos:
    needs: build-macos
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-macos
          path: build/
      - name: Fix permissions
        run: chmod +x build/putup build/test/unit/putup_test
      - name: Run tests
        run: ./build/test/unit/putup_test

  tidy:
    needs: build-linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-linux
          path: build/
      - name: Fix permissions
        run: chmod +x build/putup
      - name: Run clang-tidy
        run: make tidy PUTUP=./build/putup RUN_CLANG_TIDY=run-clang-tidy-18

  coverage:
    needs: build-linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-linux
          path: build/
      - name: Fix permissions
        run: chmod +x build/putup
      - name: Install gcovr
        run: pipx install gcovr
      - name: Build instrumented variant and generate report
        run: make coverage PUTUP=./build/putup
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: build-coverage/report/

  build-gcc-bsp:
    needs: build-linux
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-linux
          path: build/
      - name: Fix permissions
        run: chmod +x build/putup
      - name: Cache source tarballs
        uses: actions/cache@v4
        with:
          path: source-root
          key: gcc-bsp-src-gcc15.2.0-binutils2.44
      - name: Download source
        working-directory: examples/bsp
        run: scripts/download-source.sh ../../source-root
      - name: Configure
        working-directory: examples/bsp
        run: ../../build/putup configure --config configs/x86_64-linux.config -C . -S ../../source-root -B ../../build-gcc
      - name: Build
        working-directory: examples/bsp
        run: ../../build/putup -C . -S ../../source-root -B ../../build-gcc -j$(nproc)
      - name: Smoke test cc1
        run: |
          echo 'int main() { return 0; }' > /tmp/test.c
          build-gcc/gcc/gcc/cc1 /tmp/test.c -quiet -o /tmp/test.s
          grep 'GCC.*15.2.0' /tmp/test.s
