name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Bootstrap build
        run: ./bootstrap-linux.sh
      - name: Run tests
        run: ./build/test/unit/putup_test
      - name: Strip binary
        run: strip build/putup
      - name: Rename artifact
        run: mv build/putup putup-linux-x86_64
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: putup-linux-x86_64
          path: putup-linux-x86_64

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Bootstrap build
        run: ./bootstrap-macos.sh
      - name: Run tests
        run: ./build/test/unit/putup_test
      - name: Strip binary
        run: strip build/putup
      - name: Rename artifact
        run: mv build/putup putup-macos-arm64
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: putup-macos-arm64
          path: putup-macos-arm64

  # Windows x86_64 is cross-compiled from Linux with clang-cl + xwin (MSVC ABI),
  # driven by the native Linux putup, and smoke-tested under Wine.
  build-windows:
    needs: build-linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Download Linux putup (cross-build driver)
        uses: actions/download-artifact@v4
        with:
          name: putup-linux-x86_64
      - name: Fix permissions
        run: chmod +x putup-linux-x86_64
      - name: Install clang-cl toolchain + Wine
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld llvm
          sudo apt-get install -y wine64 || sudo apt-get install -y wine
          for t in clang-cl lld-link llvm-lib; do
            sudo ln -sf "$(ls /usr/bin/$t-* | sort -V | tail -1)" /usr/local/bin/$t
          done
      - name: Fetch MSVC CRT + Windows SDK (xwin)
        run: |
          curl -fsSL https://github.com/Jake-Shadle/xwin/releases/download/0.9.0/xwin-0.9.0-x86_64-unknown-linux-musl.tar.gz | tar -xz
          ./xwin-*/xwin --accept-license --arch x86_64 splat --output "$HOME/.xwin/splat"
      - name: Cross-build putup.exe
        run: |
          export XWIN_SPLAT="$HOME/.xwin/splat"
          CONFIG=xwin ./putup-linux-x86_64 configure -B build-win
          CONFIG=xwin ./putup-linux-x86_64 -B build-win
      - name: Test under Wine
        run: |
          export WINEPREFIX="$HOME/.wine-putup" WINEDEBUG=-all
          wineboot --init && sleep 2
          WINE=$(command -v wine64 || command -v wine)
          "$WINE" build-win/test/unit/putup_test.exe '~[e2e]~[shell]'
      - name: Rename artifact
        run: mv build-win/putup.exe putup-windows-x86_64.exe
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: putup-windows-x86_64.exe
          path: putup-windows-x86_64.exe

  release:
    needs: [build-linux, build-macos, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Download all artifacts
        uses: actions/download-artifact@v4
      - name: Generate checksums
        run: |
          sha256sum \
            putup-linux-x86_64/putup-linux-x86_64 \
            putup-macos-arm64/putup-macos-arm64 \
            putup-windows-x86_64.exe/putup-windows-x86_64.exe \
            | sed 's|[^ ]*/||' > sha256sums.txt
          cat sha256sums.txt
      - name: Create release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            putup-linux-x86_64/putup-linux-x86_64
            putup-macos-arm64/putup-macos-arm64
            putup-windows-x86_64.exe/putup-windows-x86_64.exe
            sha256sums.txt
          generate_release_notes: true
